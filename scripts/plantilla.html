<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Manual de procesos</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1c2230;--muted:#5d6475;--line:#d9dce3;--accent:#1f4fa3;--soft:#e8eefb;--mark:#fff1a8;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--ink:#eceff4;--muted:#9aa2b2;--line:#2f3542;--accent:#7aa2f0;--soft:#232c3d;--mark:#5b4c00;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center}
header h1{font-size:1.05rem;margin:0;white-space:nowrap}
#q{flex:1;min-width:0;font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#menu{display:none;font:inherit;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--ink)}
#salir{font:inherit;font-size:.85rem;background:none;border:0;color:var(--muted);cursor:pointer;white-space:nowrap}
.wrap{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 55px)}
nav{border-right:1px solid var(--line);background:var(--card);padding:14px 10px;overflow:auto;position:sticky;top:55px;height:calc(100vh - 55px)}
nav h2{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 8px 6px}
nav a{display:block;padding:7px 10px;border-radius:7px;color:var(--ink);text-decoration:none;font-size:.92rem}
nav a:hover{background:var(--bg)}nav a.on{background:var(--soft);color:var(--accent);font-weight:600}
nav small{display:block;color:var(--muted);font-size:.75rem;font-weight:400}
nav .pie{margin:18px 8px 0;font-size:.75rem;color:var(--muted)}
main{padding:24px 16px 60px;min-width:0}
article{max-width:860px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px clamp(16px,4vw,40px)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.chip{font-size:.78rem;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--ink)}
.orig{font-size:.85rem;color:var(--accent)}
.doc table{border-collapse:collapse;width:100%;margin:10px 0;display:block;overflow-x:auto}
.doc td,.doc th{border:1px solid var(--line);padding:6px 9px;vertical-align:top}
.doc td p,.doc th p{margin:2px 0}
.doc img{max-width:100%;height:auto}
.doc a{color:var(--accent);word-break:break-word}
.doc p{margin:.45em 0}
.doc li{margin:.2em 0}
.btn-preg{font:600 .9rem system-ui,sans-serif;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 12px;cursor:pointer;white-space:nowrap}
@media (prefers-color-scheme:dark){.btn-preg{color:#0d1320}}
.preg{max-width:860px;margin:0 auto}
.preg form{display:flex;gap:8px;margin:0 0 10px}
.preg input{flex:1;min-width:0;font:inherit;font-size:1.05rem;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.preg .estado{color:var(--muted);font-size:.88rem;min-height:1.3em;margin:0 0 12px}
.preg .sug{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.preg .sug button{font:inherit;font-size:.85rem;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 11px;color:var(--ink);cursor:pointer}
.resp{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.resp .de{font-size:.8rem;color:var(--muted);margin-bottom:6px}
.resp blockquote{margin:0;font-size:1rem}
.resp a{font-size:.85rem;color:var(--accent);display:inline-block;margin-top:8px}
.nores{background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:16px;color:var(--muted)}
.nota{font-size:.78rem;color:var(--muted);margin-top:14px}
.doc .hl{background:var(--mark);border-radius:4px;box-shadow:0 0 0 4px var(--mark)}
mark{background:var(--mark);color:inherit;border-radius:2px}
.res{max-width:860px;margin:0 auto}
.res a{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px;color:var(--ink);text-decoration:none}
.res a:hover{border-color:var(--accent)}
.res a.ask{border-style:dashed;border-color:var(--accent)}.res a.ask b{color:var(--accent)}
.res b{display:block;margin-bottom:4px}.res span{color:var(--muted);font-size:.88rem}
.vacio{color:var(--muted);text-align:center;padding:40px 0}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (max-width:760px){
  .wrap{grid-template-columns:1fr}
  nav{display:none;position:fixed;inset:55px 0 0 0;height:auto;z-index:4;border:0}
  body.nav-abierto nav{display:block}
  #menu{display:block}header h1{display:none}
  main{padding:14px 0 50px}article{border-radius:0;border-left:0;border-right:0}
}
@media print{header,nav{display:none}.wrap{display:block}article{border:0}}
</style></head><body>
<header>
  <button id="menu" aria-label="Índice">☰</button>
  <h1>Manual de procesos</h1>
  <input id="q" type="search" placeholder="Buscar o preguntar… (Enter para preguntar)" aria-label="Buscar">
  <button id="preg" class="btn-preg">Preguntar</button>
  <button id="salir" title="Olvidar la contraseña en este dispositivo">Salir</button>
</header>
<div class="wrap"><nav id="nav"></nav><main id="main"></main></div>
<script>
const DOCS=__DOCS__, ACT='__ACTUALIZADO__';
const $=s=>document.querySelector(s), esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
DOCS.forEach(d=>{const t=document.createElement('div');t.innerHTML=d.html;d.texto=t.textContent.replace(/\s+/g,' ');d.nt=norm(d.texto+' '+d.titulo+' '+d.codigo)});

function pintarNav(){
  let h='',area=null;
  DOCS.forEach(d=>{if(d.area!==area){area=d.area;h+=`<h2>${esc(area)}</h2>`}
    h+=`<a href="#d${d.n}" data-n="${d.n}">${esc(d.titulo)}<small>${esc(d.codigo||'')}</small></a>`});
  h+=`<div class="pie">Actualizado desde Google Docs: ${ACT}</div>`;
  $('#nav').innerHTML=h;
}
function verDoc(n){
  const d=DOCS.find(x=>x.n==n)||DOCS[0]; if(!d){$('#main').innerHTML='<p class="vacio">Todavía no hay documentos.</p>';return}
  const chips=[d.codigo&&'Código: '+d.codigo,d.version&&'Versión '+d.version,d.fecha&&'Publicado: '+d.fecha,d.area].filter(Boolean);
  $('#main').innerHTML=`<article><div class="meta">${chips.map(c=>`<span class="chip">${esc(c)}</span>`).join('')}
    <a class="orig" href="https://docs.google.com/document/d/${d.id}/edit" target="_blank" rel="noopener">Ver original ↗</a></div>
    <div class="doc">${d.html}</div></article>`;
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.n==d.n));
  document.title=d.titulo+' · Manual de procesos';
}
function resaltar(root,q){
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),nodos=[];while(w.nextNode())nodos.push(w.currentNode);
  const nq=norm(q);
  nodos.forEach(n=>{const t=n.nodeValue,i=norm(t).indexOf(nq);if(i<0)return;
    const m=document.createElement('mark');const r=document.createRange();r.setStart(n,i);r.setEnd(n,i+q.length);r.surroundContents(m)});
  const p=root.querySelector('mark');if(p)p.scrollIntoView({block:'center'});
}
function frag(d,ntq,largo){const i=norm(d.texto).indexOf(ntq);if(i<0)return '';const a=Math.max(0,i-80);
  return (a?'…':'')+esc(d.texto.slice(a,i))+'<mark>'+esc(d.texto.slice(i,i+largo))+'</mark>'+esc(d.texto.slice(i+largo,i+largo+120))+'…'}
function buscar(q){
  q=q.trim();const nq=norm(q);
  if(!nq){ruta();return}
  // 1) frase exacta  2) si no hay, todas las palabras importantes
  let res=DOCS.filter(d=>d.nt.includes(nq)).map(d=>({d,h:q,f:frag(d,nq,nq.length)}));
  if(!res.length){
    const pal=norm(q).split(/[^a-z0-9ñ]+/).filter(w=>w.length>1&&!STOP.has(w));
    if(pal.length)res=DOCS.filter(d=>pal.every(w=>d.nt.includes(w.slice(0,5)))).map(d=>{const w=pal.find(w=>d.nt.includes(w))||pal[0];
      const i=norm(d.texto).indexOf(w);return{d,h:i<0?'':d.texto.slice(i,i+w.length),f:frag(d,w,w.length)}});
  }
  const preg=`<a class="ask" href="#preguntar" data-ask="${esc(q)}"><b>💬 Preguntarle al asistente: «${esc(q)}»</b><span>Muestra la parte del manual que responde la pregunta (o Enter).</span></a>`;
  $('#main').innerHTML='<div class="res">'+preg+(res.length?res.map(r=>
    `<a href="#d${r.d.n}" data-q="${esc(r.h)}"><b>${esc(r.d.titulo)}</b><span>${r.f}</span></a>`).join(''):'<p class="vacio">No aparece ese texto en los documentos.</p>')+'</div>';
}
function ruta(){if(location.hash==='#preguntar'){verPreguntar();document.body.classList.remove('nav-abierto');return}const m=location.hash.match(/^#d(\d+)/);verDoc(m?m[1]:(DOCS[0]&&DOCS[0].n));document.body.classList.remove('nav-abierto')}
$('#q').addEventListener('input',e=>buscar(e.target.value));
let PEND='';
function irAPreguntar(q){PEND=q;$('#q').value='';if(location.hash==='#preguntar')ruta();else location.hash='preguntar'}
$('#q').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.value.trim()){e.preventDefault();irAPreguntar(e.target.value.trim())}});
$('#main').addEventListener('click',e=>{const a=e.target.closest('.res a');if(!a)return;e.preventDefault();
  if(a.dataset.ask!==undefined){irAPreguntar(a.dataset.ask);return}
  const q=a.dataset.q;$('#q').value='';history.pushState(null,'',a.getAttribute('href'));ruta();if(q)resaltar($('.doc'),q)});
$('#menu').onclick=()=>document.body.classList.toggle('nav-abierto');
$('#salir').onclick=()=>{try{localStorage.removeItem('mp-k');sessionStorage.removeItem('mp-k')}catch(e){}location.reload()};
window.addEventListener('hashchange',()=>{$('#q').value='';ruta()});

/* ---------- Asistente: responde solo con fragmentos textuales del manual ---------- */
const STOP=new Set('le lo mas qu a al algo como con cual cuales cuando de del el ella en es esa ese eso esta este esto hay la las le lo los mas me mi no o para pero por que se si sin sobre son su sus un una uno y ya debe hace hacer tiene tienen puedo puede donde quien'.split(' '));
const raiz=w=>w.slice(0,5), toks=s=>norm(s).split(/[^a-z0-9ñ]+/).filter(w=>w.length>1&&!STOP.has(w)).map(raiz);
let PAS=null,MODELO=null,VECS=null;
function armarPasajes(){
  if(PAS)return PAS;PAS=[];
  DOCS.forEach(d=>{const div=document.createElement('div');div.innerHTML=d.html;
    const cabecera=div.querySelector('table');let sec='',cur=null;
    [...div.querySelectorAll('p,li')].forEach((el,i)=>{
      if(cabecera&&cabecera.contains(el)&&/control de documentos/i.test(cabecera.textContent))return;
      const t=el.textContent.replace(/\s+/g,' ').trim();if(!t)return;
      const b=[...el.querySelectorAll('b')].map(x=>x.textContent).join('').replace(/\s+/g,' ').trim();
      if(b&&b.replace(/[\s:]+$/,'')===t.replace(/[\s:]+$/,'')&&t.length<90){sec=t.replace(/\s*:$/,'');cur=null;return}
      if(t.length<25&&!cur)return;
      if(cur&&cur.sec===sec&&cur.t.length+t.length<420&&(!/^[^:]{2,40}:/.test(t)||/^(frecuencia|fuente|nota|ejemplo)s?\s*:/i.test(t))){cur.t+=' '+t;cur.els.push(i);return}
      cur={n:d.n,sec,t,els:[i]};PAS.push(cur)})});
  PAS.forEach(p=>p.k=new Set(toks(p.sec+' '+p.t)));
  return PAS;
}
const hash=s=>{let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return 'v1-'+(h>>>0).toString(36)+'-'+s.length};
function idb(op,key,val){return new Promise(res=>{try{const r=indexedDB.open('manual-ia',1);r.onupgradeneeded=()=>r.result.createObjectStore('v');
  r.onsuccess=()=>{try{const tx=r.result.transaction('v',op?'readwrite':'readonly'),st=tx.objectStore('v');const q=op?st.put(val,key):st.get(key);
    q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)}catch(e){res(null)}};r.onerror=()=>res(null)}catch(e){res(null)}})}
let PREP=null;
function prepararIA(estado){
  if(!PREP)PREP=(async()=>{
    armarPasajes();
    estado('Preparando el asistente… (la primera vez descarga ~120 MB, después queda guardado). Ya podés preguntar.');
    const T=await import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.0');
    const vistos={};
    MODELO=await T.pipeline('feature-extraction','Xenova/multilingual-e5-small',{dtype:'q8',progress_callback:e=>{
      if(e.status==='progress'&&e.total){vistos[e.file]=[e.loaded,e.total];const l=Object.values(vistos).reduce((a,x)=>a+x[0],0),tt=Object.values(vistos).reduce((a,x)=>a+x[1],0);
        PCT=Math.round(l/tt*100)+'%';if(!$('#respuestas')||!$('#respuestas').innerHTML)estado(`Preparando el asistente… ${PCT} (solo la primera vez)`)}}});
    const clave=hash(PAS.map(p=>p.sec+p.t).join('|'));
    let v=await idb(0,clave);
    if(!v||v.length!==PAS.length){
      v=[];for(let i=0;i<PAS.length;i+=16){PCT='casi listo';if(!$('#respuestas')||!$('#respuestas').innerHTML)estado(`Leyendo el manual… ${Math.round(i/PAS.length*100)}%`);
        const out=await MODELO(PAS.slice(i,i+16).map(p=>'passage: '+(p.sec?p.sec+'. ':'')+p.t),{pooling:'mean',normalize:true});v.push(...out.tolist())}
      idb(1,clave,v);
    }
    VECS=v;
  })().catch(e=>{PREP=null;throw e});
  return PREP;
}
const est=s=>{const e=$('#estado');if(e)e.textContent=s};
let PCT='';
function porPalabras(q){
  const qk=toks(q);if(!qk.length)return[];
  return PAS.map((p,i)=>{const hits=qk.filter(k=>p.k.has(k)).length;if(!hits)return null;
    const ini=toks(p.t.split(':')[0]);const def=/^[^:]{2,40}:/.test(p.t)&&qk.some(k=>ini.includes(k))?0.3:0;
    return{i,s:hits/qk.length+def-p.t.length/5000}}).filter(Boolean).sort((a,b)=>b.s-a.s).slice(0,3);
}
function mostrar(top,nota){
  const box=$('#respuestas');
  if(!top.length){box.innerHTML='<div class="nores">No encontré esto en el manual. Probá con otras palabras o revisá el índice.</div>';return}
  box.innerHTML=top.map(x=>{const p=PAS[x.i],d=DOCS.find(z=>z.n==p.n);
    return `<div class="resp"><div class="de">Según <b>${esc(d.titulo)}</b>${p.sec?' › '+esc(p.sec):''}</div>
      <blockquote>${esc(p.t)}</blockquote><a href="#d${p.n}" data-i="${x.i}">Ver en el documento →</a></div>`}).join('')+
    `<p class="nota">${nota||'Las respuestas son fragmentos textuales del manual; el asistente no agrega información propia.'}</p>`;
}
let ULTIMA='';
async function responder(q){
  ULTIMA=q;armarPasajes();$('#respuestas').innerHTML='';
  if(!VECS){
    // Respuesta inmediata por palabras mientras el modelo carga (o si no se puede cargar)
    mostrar(porPalabras(q),'Respuesta rápida por palabras clave. '+(PCT?'El asistente completo se está preparando ('+PCT+'); en cuanto esté listo se actualiza sola.':''));
    est('');
    prepararIA(est).then(()=>{if(ULTIMA===q)responder(q)}).catch(()=>{est('');const n=document.querySelector('.nota');if(n)n.textContent='Respuesta por palabras clave (el asistente completo no se pudo cargar en esta red).'});
    return;
  }
  est('Buscando…');
  const [qv]=(await MODELO(['query: '+q],{pooling:'mean',normalize:true})).tolist();
  const qk=toks(q);
  const sc=PAS.map((p,i)=>{const sem=VECS[i].reduce((a,x,j)=>a+x*qv[j],0);const kw=qk.length?qk.filter(k=>p.k.has(k)).length/qk.length:0;return{i,sem,kw,s:sem+0.04*kw}}).sort((a,b)=>b.s-a.s);
  const mejor=sc[0];est('');
  if(!mejor||(mejor.sem<0.85&&mejor.kw===0)){mostrar([]);return}
  mostrar(sc.filter(x=>x.s>=mejor.s-0.025).slice(0,3));
}
function verPreguntar(){
  const ej=['¿Qué es un lead duplicado?','¿Cuándo un registro está gestionado?','¿A qué áreas aplica el funnel?'];
  $('#main').innerHTML=`<div class="preg"><form id="fp"><input id="qp" placeholder="Escribí tu pregunta…" aria-label="Pregunta" autocomplete="off"><button class="btn-preg">Preguntar</button></form>
    <div class="sug">${ej.map(e=>`<button type="button">${esc(e)}</button>`).join('')}</div>
    <div class="estado" id="estado" role="status"></div><div id="respuestas"></div></div>`;
  document.querySelectorAll('nav a').forEach(a=>a.classList.remove('on'));
  document.title='Preguntar · Manual de procesos';
  $('#fp').onsubmit=e=>{e.preventDefault();const q=$('#qp').value.trim();if(q)responder(q)};
  document.querySelectorAll('.sug button').forEach(b=>b.onclick=()=>{$('#qp').value=b.textContent;responder(b.textContent)});
  $('#qp').focus();
  if(PEND){const q=PEND;PEND='';$('#qp').value=q;responder(q)}
  prepararIA(est).then(()=>{if(/Preparando|Leyendo/.test(($('#estado')||{}).textContent||''))est('Listo. Preguntá lo que necesites.')}).catch(()=>est('No se pudo cargar el asistente (¿sin conexión?).'));
}
$('#preg').onclick=()=>{$('#q').value='';location.hash='preguntar'};
$('#main').addEventListener('click',e=>{const a=e.target.closest('.resp a');if(!a)return;e.preventDefault();
  const p=PAS[a.dataset.i];history.pushState(null,'','#d'+p.n);verDoc(p.n);
  const els=[...document.querySelectorAll('.doc p,.doc li')];p.els.forEach(i=>els[i]&&els[i].classList.add('hl'));
  els[p.els[0]]&&els[p.els[0]].scrollIntoView({block:'center'})});
pintarNav();ruta();
</script>
</body></html>
