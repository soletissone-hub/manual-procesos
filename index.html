<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Manual de procesos</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--ink:#1c2230;--muted:#5d6475;--line:#d9dce3;--accent:#1f4fa3;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2029;--ink:#eceff4;--muted:#9aa2b2;--line:#2f3542;--accent:#7aa2f0;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif;padding:16px}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px;width:min(380px,100%);display:grid;gap:12px}
h1{margin:0;font-size:1.3rem}p{margin:0;color:var(--muted);font-size:.92rem}
input[type=password]{font:1.05rem system-ui,sans-serif;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
label{font-size:.9rem;color:var(--muted);display:flex;gap:8px;align-items:center}
button{font:600 1rem system-ui,sans-serif;padding:12px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){button{color:#0d1320}}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#err{color:#c0392b;min-height:1.2em;font-size:.9rem}
</style></head><body>
<form id="f" autocomplete="off">
  <h1>Manual de procesos</h1>
  <p>Contenido interno. Ingresá la contraseña para verlo.</p>
  <input id="k" type="password" placeholder="Contraseña" aria-label="Contraseña" autofocus>
  <label><input id="rec" type="checkbox"> Recordar en este dispositivo</label>
  <button>Entrar</button>
  <div id="err" role="alert"></div>
</form>

const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function abrir(clave,recordar){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(clave),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(B.s),iterations:B.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(B.i)},key,d(B.c));
  const html=new TextDecoder().decode(pt);
  try{sessionStorage.setItem('mp-k',clave);if(recordar)localStorage.setItem('mp-k',clave)}catch(e){}
  document.open();document.write(html);document.close();
}
const f=document.getElementById('f'),err=document.getElementById('err');
f.onsubmit=async e=>{
  e.preventDefault();err.textContent='Abriendo…';
  const k=document.getElementById('k').value.trim();
  try{await abrir(k,document.getElementById('rec').checked)}
  catch(x){err.textContent='Contraseña incorrecta.'}
};
(async()=>{let k=null;try{k=localStorage.getItem('mp-k')||sessionStorage.getItem('mp-k')}catch(e){}
  if(k){try{await abrir(k)}catch(e){try{localStorage.removeItem('mp-k')}catch(_){}}}})();
</script>
